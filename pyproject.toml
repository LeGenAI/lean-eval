[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-eval"
version = "0.1.0"
description = "Lean proof-model evaluation runner with LM Studio and Lean REPL verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "pexpect>=4.9.0",
  "pyyaml>=6.0.0",
  "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
]

[tool.setuptools]
packages = ["src", "src.evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
